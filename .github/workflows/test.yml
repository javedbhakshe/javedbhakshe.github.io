name: Test GitHub Actions
on:
  push:
    branches: [actions]
  workflow_dispatch:
    branches: [actions]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  Deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Fetch repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Build project
        run: npm run build
      - name: Deploy to GitHub Pages
        run: echo "Deploying to GitHub Pages..."
